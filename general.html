<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AnRat | General</title>
  <meta name="description" content="The community discussion board for AnRat.">
  <link rel="icon" type="image/x-icon" href="Images/PFP.ico">
  <link rel="stylesheet" href="style.css">
  <script src="background-time.js" defer></script>
  <link rel="stylesheet" href="blog.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="blog-page page-enter">
  <div class="background" aria-hidden="true"></div>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo"><div class="icon pfp"><img src="Images/PFP.png" alt=""></div></div>
        <div>
          <h1>AnRat — General</h1>
          <p class="lead">The community board.</p>
        </div>
      </div>
      <nav aria-label="Site navigation">
        <a href="index.html" class="cta" data-page-transition>Home</a>
        <a href="blog.html" class="cta" data-page-transition>Blog</a>
        <a href="https://discord.gg/UDsjHHn55r" class="cta" target="_blank" rel="noreferrer">Contact</a>
      </nav>
    </header>

    <main>
      <article class="card blog-window discussion-window">
        <div class="window-chrome" aria-hidden="true"><span>general.window</span><span class="window-controls"><i>−</i><i>□</i><i class="window-close-static">×</i></span></div>
        <div class="discussion-heading">
          <div>
            <p class="blog-kicker">discussion: general</p>
            <h2 class="title">General board</h2>
            <p class="desc">Say hi, share something cool, or start a conversation. GitHub sign-in is needed to post and reply.</p>
          </div>
          <span class="discussion-status"><i class="fa-brands fa-github" aria-hidden="true"></i> GitHub sign-in</span>
        </div>
        <div class="giscus-shell" aria-label="General discussion board">
          <script src="https://giscus.app/client.js"
                  data-repo="AnRat-source/Introduction"
                  data-repo-id="R_kgDOQU7EBg"
                  data-category="General"
                  data-category-id="DIC_kwDOQU7EBs4DKMeQ"
                  data-mapping="pathname"
                  data-strict="0"
                  data-reactions-enabled="1"
                  data-emit-metadata="0"
                  data-input-position="bottom"
                  data-theme="preferred_color_scheme"
                  data-lang="en"
                  crossorigin="anonymous"
                  async>
          </script>
        </div>
      </article>
    </main>
    <footer class="note">© <span data-current-year></span> AnRat · Community discussion powered by GitHub Discussions</footer>
  </div>
  <script src="blog.js"></script>
</body>
</html>
