<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infinite Fibonacci</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0e101a;color:#e9dff5;font-family:'Cascadia Code',Consolas,monospace}header{position:sticky;top:0;background:#171827ed;backdrop-filter:blur(12px);border-bottom:1px solid #54356d;padding:12px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center;z-index:2}h1{font-size:16px;margin:0;color:#dfabff}#count{font-size:12px;color:#b5a5c4}main{padding:22px;max-width:1300px;margin:auto}#numbers{font-size:15px;line-height:1.9;overflow-wrap:anywhere;white-space:normal}#sentinel{height:80px}button{background:#3b254f;color:#f1dcff;border:1px solid #8056a0;padding:7px 10px;border-radius:6px;cursor:pointer}button:hover{background:#54326d}
</style>
</head>
<body><header><h1>∞ Fibonacci Sequence</h1><div id="count">0 numbers</div><button id="top">↑ Top</button></header><main><div id="numbers" aria-label="Fibonacci numbers separated by commas"></div><div id="sentinel"></div></main>
<script>
const numbers=document.getElementById('numbers'), count=document.getElementById('count'), sentinel=document.getElementById('sentinel');
let a=1n,b=1n,total=0,busy=false;
function appendBatch(size=80){if(busy)return;busy=true;let parts=[];for(let i=0;i<size;i++){parts.push(a.toString());[a,b]=[b,a+b];total++}numbers.append(document.createTextNode((total>size?', ':'')+parts.join(', ')));count.textContent=total.toLocaleString()+' numbers';busy=false;}
function fillViewport(){let rounds=0;while(document.documentElement.scrollHeight<=innerHeight+250&&rounds++<30)appendBatch(80)}
const observer=new IntersectionObserver(entries=>{if(entries[0].isIntersecting){appendBatch(80);}}, {rootMargin:'700px'});
appendBatch();fillViewport();observer.observe(sentinel);
addEventListener('resize',fillViewport);document.getElementById('top').onclick=()=>scrollTo({top:0,behavior:'smooth'});
</script></body></html>
