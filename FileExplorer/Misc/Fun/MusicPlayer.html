<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d082d">
  <link rel="icon" type="image/svg+xml" href="../../../assets/music-disc.svg">
  <title>Music Player</title>
  <style>
    :root { color-scheme: dark; --deep: #0b0c12; --purple: #5f177c; --pink: #bd4fe8; --lavender: #e9c3ff; --white: #fffaff; }
    * { box-sizing: border-box; }
    body { min-height: 100dvh; margin: 0; overflow: hidden; color: var(--white); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--deep); }
    .player, .player.in-pip { position: relative; isolation: isolate; container-type: size; width: 100vw; height: 100dvh; min-height: 0; padding: clamp(14px, 7cqh, 52px) clamp(16px, 9cqw, 78px); display: flex; flex-direction: column; align-items: center; overflow: hidden; border: 0; border-radius: 0; background: rgba(9, 9, 15, .58); box-shadow: none; }

    /* The current YouTube video becomes a soft moving background rather than a visible video player. */
    #youtube-player { position: absolute; z-index: -2; inset: 0; overflow: hidden; pointer-events: none; filter: blur(5px) saturate(1.08); opacity: 1; transform: translateY(-125px) scale(2) !important;; }
    #youtube-player iframe {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        border: 0;
        transform: none !important;
    }
    .video-wash { position: absolute; z-index: -1; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(8,9,15,.38), rgba(8,9,15,.73)), radial-gradient(circle at 50% 45%, transparent 22%, rgba(8,9,15,.4) 90%); opacity: 0; }
    /* Seven bars fill the available width and stay flush with the window bottom, including PiP. */
    .visualizer { position: absolute; z-index: 0; inset: 0; display: flex; align-items: flex-end; justify-content: center; gap: clamp(5px, 1.35cqw, 19px); padding: 0 clamp(6px, 2cqw, 26px); overflow: hidden; pointer-events: none; }
    .visualizer-bar { flex: 1 1 0; width: 0; min-width: 0; max-width: clamp(32px, 12cqw, 180px); height: var(--bar-height, 4%); max-height: 85%; border: 1px solid rgba(255,255,255,.28); border-bottom: 0; border-radius: clamp(10px, 2cqw, 28px) clamp(10px, 2cqw, 28px) 0 0; background: linear-gradient(180deg, rgba(240,206,255,.2), rgba(155,70,207,.1)); box-shadow: inset 1px 0 rgba(255,255,255,.2), 0 0 16px rgba(202,111,255,.1); backdrop-filter: blur(10px) saturate(165%) contrast(120%); -webkit-backdrop-filter: blur(10px) saturate(165%) contrast(120%); transform: translateX(var(--refraction, 0px)); transform-origin: bottom; transition: none; }
    .visualizer-bar:nth-child(odd) { background: linear-gradient(180deg, rgba(176,234,255,.31), rgba(124,85,217,.08)); }
    .visualizer-bar:nth-child(3n) { --refraction: 3px; }
    .visualizer-bar:nth-child(4n) { --refraction: -3px; }
    @media (prefers-reduced-motion: reduce) { .visualizer-bar { transition: none; } }
    .audio-sync { position: absolute; z-index: 3; right: clamp(12px, 3cqw, 28px); bottom: clamp(62px, 11cqh, 84px); min-width: 0; min-height: 32px; padding: 7px 11px; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; background: rgba(8,9,15,.6); backdrop-filter: blur(10px); color: var(--white); font-size: 10px; font-weight: 700; letter-spacing: .04em; opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity .2s ease, transform .2s ease, background .2s ease; }
    .player:hover .audio-sync, .audio-sync:focus-visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .audio-sync:hover, .audio-sync:focus-visible, .audio-sync[aria-pressed="true"] { background: rgba(95,23,124,.8); }
    .volume-control { position: absolute; z-index: 3; bottom: clamp(12px, 3cqh, 24px); left: clamp(12px, 3cqw, 28px); width: 40px; height: 40px; display: flex; align-items: center; overflow: hidden; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; background: rgba(8,9,15,.4); backdrop-filter: blur(10px); opacity: 0; pointer-events: none; transform: translateY(8px); transition: width .2s ease, background .2s ease, opacity .2s ease, transform .2s ease; }
    .player:hover .volume-control { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .volume-control.expanded, .volume-control:focus-within { width: min(160px, calc(100cqw - 24px)); background: rgba(8,9,15,.66); }
    #volume-toggle { width: 38px; min-width: 38px; height: 38px; min-height: 38px; padding: 0; display: grid; place-items: center; text-shadow: none; }
    .volume-icon { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2.4; }
    .volume-icon .wave, .volume-icon .mute-mark { display: none; }
    #volume-toggle[data-volume="low"] .wave-low, #volume-toggle[data-volume="high"] .wave { display: inline; }
    #volume-toggle[data-volume="muted"] .mute-mark { display: inline; }
    #volume-slider { width: 0; min-width: 0; margin: 0; opacity: 0; accent-color: var(--lavender); cursor: pointer; transition: width .2s ease, opacity .15s ease; }
    .volume-control.expanded #volume-slider, .volume-control:focus-within #volume-slider { width: 104px; min-width: 104px; margin-right: 12px; opacity: 1; }

    .now-playing, .cover-wrap, #title, .progress-group, .transport { position: relative; z-index: 1; }
    .now-playing { margin: 0 0 clamp(10px, 4cqh, 31px); color: var(--lavender); font-size: clamp(9px, 1.8cqh, 11px); font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    .cover-wrap {
        position: relative;
        width: min(68cqw, 44cqh, 360px);
        aspect-ratio: 1 / 1;
        flex: 0 0 auto;
        overflow: hidden;
        border: 3px solid rgba(255,255,255,.24);
        border-radius: clamp(14px, 4cqh, 28px);
        background: linear-gradient(135deg, #d768ef, #43105f);
        box-shadow: 0 18px 38px rgba(0,0,0,.39);
    }

    #thumbnail {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        transform: translate(-50%, -50%) scale(1.35);
        transition: opacity .2s ease;
    }
    #title { width: min(100%, 520px); min-height: 0; margin: clamp(10px, 4cqh, 27px) 0 clamp(8px, 2cqh, 15px); overflow: hidden; color: var(--white); font-size: clamp(14px, 3.1cqh, 21px); font-weight: 750; letter-spacing: -.02em; line-height: 1.3; text-align: center; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 2px 15px #160020; }
    .progress-group { width: min(100%, 520px); }
    #seek { width: 100%; height: 5px; display: block; margin: 0; appearance: none; border-radius: 999px; outline: none; cursor: pointer; background: linear-gradient(to right, var(--lavender) 0%, var(--lavender) 0%, rgba(255,255,255,.25) 0%, rgba(255,255,255,.25) 100%); }
    #seek::-webkit-slider-thumb { width: 13px; height: 13px; appearance: none; border: 0; border-radius: 50%; background: var(--white); box-shadow: 0 0 12px rgba(255,255,255,.9); }
    #seek::-moz-range-thumb { width: 13px; height: 13px; border: 0; border-radius: 50%; background: var(--white); box-shadow: 0 0 12px rgba(255,255,255,.9); }
    .time-row { display: flex; justify-content: space-between; margin-top: clamp(5px, 1.5cqh, 10px); color: rgba(255,255,255,.74); font-size: clamp(9px, 1.8cqh, 11px); font-variant-numeric: tabular-nums; }
    .transport { width: min(100%, 520px); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: clamp(6px, 4cqw, 25px); margin-top: clamp(13px, 5cqh, 31px); }
    button { min-width: clamp(40px, 9cqh, 56px); min-height: clamp(40px, 9cqh, 56px); border: 0; color: var(--white); background: transparent; cursor: pointer; font: inherit; transition: transform .18s ease, background .18s ease; text-shadow: 0 2px 12px #180522; }
    button:hover { transform: scale(1.07); } button:focus-visible { outline: 2px solid var(--white); outline-offset: 4px; }
    .transport-icon { width: clamp(23px, 4.8cqh, 29px); height: clamp(23px, 4.8cqh, 29px); fill: currentColor; } #previous { justify-self: end; } #next { justify-self: start; }
    #play-pause { width: clamp(54px, 12cqh, 76px); height: clamp(54px, 12cqh, 76px); min-width: clamp(54px, 12cqh, 76px); min-height: clamp(54px, 12cqh, 76px); display: grid; place-items: center; border-radius: 50%; background: linear-gradient(145deg, #e485ff, #9131bb); box-shadow: 0 12px 25px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.4); font-size: clamp(22px, 5cqh, 30px); text-shadow: none; }
    #play-pause .transport-icon { width: clamp(22px, 4.7cqh, 29px); height: clamp(22px, 4.7cqh, 29px); }
    #play-pause .pause-icon { display: none; }
    #play-pause:not(.is-paused) .play-icon { display: none; }
    #play-pause:not(.is-paused) .pause-icon { display: block; }
    .pip-command-hint { position: fixed; z-index: 4; right: 14px; bottom: 14px; left: 14px; display: none; margin: 0; padding: 8px 10px; border: 1px solid rgba(233,195,255,.45); background: rgba(11,12,18,.72); box-shadow: 0 5px 18px rgba(0,0,0,.3); color: var(--lavender); font: 600 clamp(10px, 2cqh, 12px)/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center; }
    body.not-in-pip .pip-command-hint { display: block; }
  </style>
  <link rel="stylesheet" href="../../app-theme.css">
</head>
<body>
  <main class="player" aria-label="Music player">
    <div id="youtube-player" aria-hidden="true"></div>
    <div class="video-wash" aria-hidden="true"></div>
    <div class="visualizer" id="visualizer" aria-hidden="true"></div>
    <button id="audio-sync" class="audio-sync" type="button" aria-pressed="false" title="React to actual audio: choose This Tab and enable Share tab audio">LIVE AUDIO: OFF</button>
    <div class="volume-control" id="volume-control">
      <button id="volume-toggle" type="button" aria-label="Adjust volume" aria-expanded="false" data-volume="high">
        <svg class="volume-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h4l5-4v12l-5-4H4z"/><path class="wave wave-low" d="M16 9.5a4 4 0 0 1 0 5"/><path class="wave wave-high" d="M18.5 7a7.5 7.5 0 0 1 0 10"/><path class="mute-mark" d="m16 10 5 5m0-5-5 5"/></svg>
      </button>
      <input id="volume-slider" type="range" min="0" max="100" value="100" aria-label="Volume">
    </div>
    <p class="now-playing">Now playing</p>
    <div class="cover-wrap"><img id="thumbnail" src="https://i.ytimg.com/vi/default/hqdefault.jpg" alt="Current track thumbnail"></div>
    <h1 id="title">Loading playlist…</h1>
    <div class="progress-group">
      <input id="seek" type="range" min="0" max="100" value="0" aria-label="Seek through current song">
      <div class="time-row"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
    </div>
    <div class="transport" aria-label="Playback controls">
      <button id="previous" type="button" aria-label="Previous track"><svg class="transport-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zm3 7 9 7V5z"/></svg></button>
      <button id="play-pause" class="is-paused" type="button" aria-label="Play"><svg class="transport-icon play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><svg class="transport-icon pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg></button>
      <button id="next" type="button" aria-label="Next track"><svg class="transport-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM6 5v14l9-7z"/></svg></button>
    </div>
  </main>
  <p class="pip-command-hint">Type <b>"music"</b> in the command bar to open PiP.</p>

  <script>
    (() => {
      'use strict';
      const DEFAULT_PLAYLIST_ID = 'PLAEnfbyXD6VmNMtp8F2ylofRc6nautGPk';
      const getPlaylistIdFromQuery = () => {
        const suppliedLink = new URLSearchParams(window.location.search).get('link');
        if (!suppliedLink) return DEFAULT_PLAYLIST_ID;
        try {
          const playlistUrl = new URL(suppliedLink);
          const youtubeHost = /(^|\.)youtube\.com$/i.test(playlistUrl.hostname);
          const playlistId = playlistUrl.searchParams.get('list');
          return youtubeHost && /^[A-Za-z0-9_-]+$/.test(playlistId || '') ? playlistId : DEFAULT_PLAYLIST_ID;
        } catch {
          return DEFAULT_PLAYLIST_ID;
        }
      };
      const PLAYLIST_ID = getPlaylistIdFromQuery();
      const thumbnail = document.getElementById('thumbnail');
      const title = document.getElementById('title');
      const seek = document.getElementById('seek');
      const elapsed = document.getElementById('elapsed');
      const duration = document.getElementById('duration');
      const playPause = document.getElementById('play-pause');
      const volumeControl = document.getElementById('volume-control');
      const volumeToggle = document.getElementById('volume-toggle');
      const volumeSlider = document.getElementById('volume-slider');
      const visualizer = document.getElementById('visualizer');
      const playerCard = document.querySelector('.player');
      const audioSync = document.getElementById('audio-sync');
      const supportsDocumentPiP = 'documentPictureInPicture' in window;
      const embeddedInDocumentPiP = new URLSearchParams(window.location.search).has('embedded');
      if (!embeddedInDocumentPiP) document.body.classList.add('not-in-pip');
      let player, ready = false, updateTimer, lastVideoId = '', pipWindow;
      // YouTube runs in a cross-origin iframe, so its raw audio is not accessible
      // to this page. The LIVE AUDIO button optionally captures tab audio with
      // the browser's explicit sharing permission; otherwise player volume drives
      // a convincing, but synthetic, animation.
      const BAR_COUNT = 7;
      const visualizerBars = Array.from({ length: BAR_COUNT }, (_, index) => {
        const bar = document.createElement('span');
        bar.className = 'visualizer-bar';
        bar.style.setProperty('--bar-height', `${4 + index % 3}%`);
        visualizer.append(bar);
        return bar;
      });
      const clamp01 = value => Math.max(0, Math.min(1, value));
      const barHeights = new Float32Array(BAR_COUNT).fill(4);
      const frequencyLevels = new Float32Array(BAR_COUNT);
      let captureStream = null;
      let audioContext = null;
      let audioSource = null;
      let audioAnalyser = null;
      let frequencyData = null;
      let timeDomainData = null;
      let lastFrameTime = 0;
      let animationPhase = 0;
      let smoothEnergy = 0;

      const stopAudioCapture = () => {
        if (captureStream) captureStream.getTracks().forEach(track => track.stop());
        audioSource?.disconnect();
        audioAnalyser?.disconnect();
        if (audioContext) audioContext.close().catch(() => {});
        captureStream = null;
        audioContext = null;
        audioSource = null;
        audioAnalyser = null;
        frequencyData = null;
        timeDomainData = null;
        audioSync.textContent = 'LIVE AUDIO: OFF';
        audioSync.setAttribute('aria-pressed', 'false');
        audioSync.title = 'React to actual audio: choose This Tab and enable Share tab audio';
      };

      audioSync.addEventListener('click', async () => {
        if (captureStream) {
          stopAudioCapture();
          return;
        }
        if (!navigator.mediaDevices?.getDisplayMedia || !window.AudioContext) {
          audioSync.title = 'Your browser does not support tab-audio capture';
          audioSync.textContent = 'AUDIO UNSUPPORTED';
          return;
        }
        let stream;
        try {
          // Browsers require a user click and an explicit selection of this tab.
          stream = await navigator.mediaDevices.getDisplayMedia({
            video: true,
            audio: { suppressLocalAudioPlayback: false },
            preferCurrentTab: true,
            selfBrowserSurface: 'include',
            systemAudio: 'include'
          });
          if (!stream.getAudioTracks().length) {
            stream.getTracks().forEach(track => track.stop());
            audioSync.textContent = 'SHARE TAB AUDIO';
            audioSync.title = 'Try again: select This Tab and turn on Share tab audio';
            return;
          }
          // No routing to speakers; that could double the music or cause echo.
          const context = new AudioContext();
          const source = context.createMediaStreamSource(stream);
          const analyser = context.createAnalyser();
          analyser.fftSize = 2048;
          analyser.smoothingTimeConstant = 0.66;
          source.connect(analyser);
          await context.resume();

          captureStream = stream;
          audioContext = context;
          audioSource = source;
          audioAnalyser = analyser;
          frequencyData = new Uint8Array(analyser.frequencyBinCount);
          timeDomainData = new Uint8Array(analyser.fftSize);
          audioSync.textContent = 'LIVE AUDIO: ON';
          audioSync.setAttribute('aria-pressed', 'true');
          audioSync.title = 'Using actual shared-tab audio. Click to stop.';
          stream.getTracks().forEach(track => {
            track.addEventListener('ended', () => {
              if (captureStream === stream) stopAudioCapture();
            }, { once: true });
          });
        } catch (error) {
          stream?.getTracks().forEach(track => track.stop());
          console.warn('Tab audio could not be captured.', error);
          audioSync.textContent = 'LIVE AUDIO: OFF';
          audioSync.title = 'Permission cancelled or tab audio unavailable; click to try again';
        }
      });

      const getTabAudioEnergy = () => {
        audioAnalyser.getByteTimeDomainData(timeDomainData);
        audioAnalyser.getByteFrequencyData(frequencyData);
        let sumSquares = 0;
        for (const sample of timeDomainData) {
          const value = (sample - 128) / 128;
          sumSquares += value * value;
        }
        const rms = Math.sqrt(sumSquares / timeDomainData.length);
        const overall = clamp01(Math.pow(rms * 4.2, 0.72));
        const nyquist = audioContext.sampleRate / 2;
        for (let i = 0; i < BAR_COUNT; i++) {
          const lowHz = 65 * Math.pow(12000 / 65, i / BAR_COUNT);
          const highHz = 65 * Math.pow(12000 / 65, (i + 1) / BAR_COUNT);
          const first = Math.max(1, Math.floor(lowHz / nyquist * frequencyData.length));
          const end = Math.min(frequencyData.length, Math.max(first + 1, Math.ceil(highHz / nyquist * frequencyData.length)));
          let sum = 0;
          for (let bin = first; bin < end; bin++) sum += frequencyData[bin] / 255;
          frequencyLevels[i] = clamp01(Math.pow((sum / (end - first)) * 2.3, 0.82));
        }
        return overall;
      };

      const animateVisualizer = timestamp => {
        const delta = lastFrameTime ? Math.min(0.05, (timestamp - lastFrameTime) / 1000) : 1 / 60;
        lastFrameTime = timestamp;
        const isPlaying = ready && player?.getPlayerState?.() === YT.PlayerState.PLAYING;
        const volume = ready ? clamp01((player.isMuted() ? 0 : player.getVolume()) / 100) : 0;
        const hasCapturedAudio = !!audioAnalyser && audioContext?.state === 'running';
        const audioEnergy = hasCapturedAudio ? getTabAudioEnergy() : (isPlaying ? volume : 0);
        const smoothing = Math.min(1, delta * (audioEnergy > smoothEnergy ? 14 : 7));
        smoothEnergy += (audioEnergy - smoothEnergy) * smoothing;
        // Louder output increases *both* animation speed and the highest possible bar.
        const speed = 0.8 + smoothEnergy * 8.5;
        animationPhase += delta * speed;
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        visualizerBars.forEach((bar, index) => {
          const wave = reducedMotion ? 0.75 :
            0.5 + 0.5 * Math.sin(animationPhase * (1.7 + index * 0.14) + index * 1.65);
          const pulse = reducedMotion ? 0.75 :
            0.5 + 0.5 * Math.sin(animationPhase * 0.72 + index * 0.87);
          const level = hasCapturedAudio
            ? clamp01(frequencyLevels[index] * 0.75 + smoothEnergy * 0.25)
            : smoothEnergy;
          const maxHeight = 4 + 80 * level;
          const target = 3 + (maxHeight - 3) * (0.34 + wave * 0.44 + pulse * 0.22);
          const ease = Math.min(1, delta * (target > barHeights[index] ? 17 : 8));
          barHeights[index] += (target - barHeights[index]) * ease;
          bar.style.setProperty('--bar-height', `${barHeights[index].toFixed(2)}%`);
        });
        requestAnimationFrame(animateVisualizer);
      };
      requestAnimationFrame(animateVisualizer);
      const formatTime = seconds => { if (!Number.isFinite(seconds) || seconds < 0) return '0:00'; return `${Math.floor(seconds / 60)}:${Math.floor(seconds % 60).toString().padStart(2, '0')}`; };
      const setPlaybackButton = isPlaying => { playPause.classList.toggle('is-paused', !isPlaying); playPause.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play'); };
      const setVolumeIcon = value => {
        volumeToggle.dataset.volume = value === 0 ? 'muted' : value < 50 ? 'low' : 'high';
        volumeToggle.setAttribute('aria-label', value === 0 ? 'Volume muted' : `Volume ${value}%`);
      };
      const syncPlayerVolume = () => {
        if (!ready) return;
        const activeVolume = player.isMuted() ? 0 : Math.round(player.getVolume());
        if (Number(volumeSlider.value) !== activeVolume) volumeSlider.value = activeVolume;
        setVolumeIcon(activeVolume);
      };
      const setThumbnail = source => {
        thumbnail.style.opacity = '.5';
        thumbnail.onload = () => { thumbnail.style.opacity = '1'; };
        thumbnail.src = source;
      };
      const updateArtwork = async (videoId, trackTitle, artistName) => {
        const youtubeFallback = `https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg`;
        setThumbnail(youtubeFallback);
        const searchTerm = [trackTitle, artistName].filter(Boolean).join(' ').replace(/[\[\]()]/g, ' ').replace(/\s+/g, ' ').trim();
        if (!searchTerm) return;
        try {
          const response = await fetch(`https://itunes.apple.com/search?media=music&entity=song&limit=1&term=${encodeURIComponent(searchTerm)}`);
          if (!response.ok) return;
          const result = await response.json();
          const artwork = result.results?.[0]?.artworkUrl100;
          if (artwork && lastVideoId === videoId) setThumbnail(artwork.replace(/100x100bb$/, '600x600bb'));
        } catch {
          // Keep the YouTube image when iTunes has no matching artwork or is unavailable.
        }
      };
      const setProgress = () => {
        if (!ready) return;
        const total = player.getDuration(), current = player.getCurrentTime(), percent = total ? (current / total) * 100 : 0;
        seek.value = percent;
        seek.style.background = `linear-gradient(to right, var(--lavender) 0%, var(--lavender) ${percent}%, rgba(255,255,255,.25) ${percent}%, rgba(255,255,255,.25) 100%)`;
        elapsed.textContent = formatTime(current); duration.textContent = formatTime(total);
        syncPlayerVolume();
        const data = player.getVideoData();
        if (data?.video_id && data.video_id !== lastVideoId) {
          lastVideoId = data.video_id; title.textContent = data.title || 'Untitled track'; thumbnail.style.opacity = '.5';
          updateArtwork(data.video_id, data.title, data.author);
        }
      };
      const playShuffled = () => { player.playVideo(); };
      const cueRandomFirstTrack = (attempt = 0) => {
        const playlist = player.getPlaylist();
        if (!playlist.length && attempt < 20) {
          window.setTimeout(() => cueRandomFirstTrack(attempt + 1), 150);
          return;
        }
        const randomIndex = playlist.length ? Math.floor(Math.random() * playlist.length) : 0;
        player.cuePlaylist({ listType: 'playlist', list: PLAYLIST_ID, index: randomIndex });
        player.setShuffle({ shufflePlaylist: true });
      };
      const openDocumentPiP = async () => {
        // The portfolio command already opens this page in a Document PiP
        // window. Avoid opening a second, differently sized PiP from inside it.
        if (embeddedInDocumentPiP || !supportsDocumentPiP || (pipWindow && !pipWindow.closed)) return;
        try {
          pipWindow = await window.documentPictureInPicture.requestWindow({ width: 390, height: 620 });
          const syncPipSize = () => {
            playerCard.style.width = `${pipWindow.innerWidth}px`;
            playerCard.style.height = `${pipWindow.innerHeight}px`;
          };
          const copiedStyle = document.createElement('style');
          copiedStyle.textContent = [...document.querySelectorAll('style')].map(style => style.textContent).join('\n');
          pipWindow.document.head.append(copiedStyle);
          pipWindow.document.body.style.cssText = 'margin:0;width:100vw;height:100dvh;overflow:hidden;background:#180522;';
          playerCard.classList.add('in-pip');
          pipWindow.document.body.append(playerCard);
          syncPipSize();
          pipWindow.addEventListener('resize', syncPipSize);
          pipWindow.addEventListener('pagehide', () => {
            document.body.append(playerCard);
            playerCard.classList.remove('in-pip');
            playerCard.style.width = '';
            playerCard.style.height = '';
            pipWindow = null;
          }, { once: true });
        } catch (error) {
          console.warn('Document Picture-in-Picture was not opened.', error);
        }
      };
      window.onYouTubeIframeAPIReady = () => {
        player = new YT.Player('youtube-player', {
          width: '600', height: '600',
          playerVars: { listType: 'playlist', list: PLAYLIST_ID, playsinline: 1, rel: 0, modestbranding: 1 },
          events: {
            onReady: () => {
                ready = true;
                player.setVolume(Number(volumeSlider.value));
                syncPlayerVolume();
                centerBackgroundVideo();
                cueRandomFirstTrack();
                setProgress();
            },
            onStateChange: event => { const isPlaying = event.data === YT.PlayerState.PLAYING; if (isPlaying) { setPlaybackButton(true); clearInterval(updateTimer); updateTimer = setInterval(setProgress, 500); } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.CUED) { setPlaybackButton(false); setProgress(); } },
            onError: () => { title.textContent = 'Playlist unavailable'; }
          }
        });
      };
      playPause.addEventListener('click', () => {
        if (!ready) return;
        if (player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo();
        else { openDocumentPiP(); playShuffled(); }
      });
      volumeToggle.addEventListener('click', () => {
        const expanded = volumeControl.classList.toggle('expanded');
        volumeToggle.setAttribute('aria-expanded', String(expanded));
        if (expanded) volumeSlider.focus();
      });
      volumeSlider.addEventListener('input', () => {
        const volume = Number(volumeSlider.value);
        setVolumeIcon(volume);
        if (!ready) return;
        if (volume > 0) player.unMute();
        player.setVolume(volume);
      });
      document.getElementById('previous').addEventListener('click', () => { if (ready) { openDocumentPiP(); player.previousVideo(); player.playVideo(); } });
      document.getElementById('next').addEventListener('click', () => { if (ready) { openDocumentPiP(); player.nextVideo(); player.playVideo(); } });
      seek.addEventListener('input', () => { if (!ready) return; const total = player.getDuration(); if (total) player.seekTo((Number(seek.value) / 100) * total, true); });
      const api = document.createElement('script'); api.src = 'https://www.youtube.com/iframe_api'; api.async = true; document.head.append(api);
    
      const centerBackgroundVideo = () => {
          const container = document.getElementById('youtube-player');
          const iframe = container?.querySelector('iframe');

          if (!iframe) return;

          const width = container.clientWidth;
          const height = container.clientHeight;

          if (!width || !height) return;

          const ratio = 16 / 9;
          const zoom = 1.25;

          const videoWidth = Math.max(width, height * ratio) * zoom;
          const videoHeight = videoWidth / ratio;

          // Center the video relative to its container.
          const x = (width - videoWidth) / 2 - 200;
          const y = (height - videoHeight) / 2;

          iframe.style.setProperty('width', `${videoWidth}px`, 'important');
          iframe.style.setProperty('height', `${videoHeight}px`, 'important');
          iframe.style.setProperty('left', `${x}px`, 'important');
          iframe.style.setProperty('top', `${y}px`, 'important');
      };

      const videoResizeObserver = new ResizeObserver(centerBackgroundVideo);
      videoResizeObserver.observe(document.getElementById('youtube-player'));

      window.addEventListener('resize', centerBackgroundVideo);
    })();
  </script>
</body>
