const relayWords=['THE','WEB','IS','OURS'];
function hasAllRelayWords(){return relayWords.every(w=>state.clues.includes(w));}
function clueButton(word,by){return `<button class="crumbBtn ${state.clues.includes(word)?'found':''}" data-clue="${word}">${state.clues.includes(word)?'✓ COPIED':'✎ COPY'} ${word}</button><span class="small">← ${by}</span>`;}
function questTrail(text){return `<div class="questTrail">${text}</div>`;}
function needTape(){return state.shards.includes('castle')&&state.flags.diskDecoded;}
function nextHint(){
 if(!state.flags.diskTaken&&!state.flags.diskDecoded)return `Start with ${link('mimi.about','Mimi’s corrupted floppy')}; her About page has a label on it.`;
 if(!state.flags.diskDecoded)return `Carry the floppy to ${link('bbs.archive','Echo’s archive computer')} and follow the label.`;
 if(!state.stickers.includes('floppy'))return `Echo repaired the corrupted backup. Return to ${link('mimi.about','Mimi’s About page')} and give her the floppy sticker!`;
 if(!state.shards.includes('mimi'))return `The floppy is safe, but Mimi still needs the missing frog and moon. ${link('mimi.home','Visit Mimi again')}.`;
 if(!state.shards.includes('castle'))return `The decoder has a lost cassette blueprint. Win ${link('castle.arcade','Sir Byte’s Star Catcher')} to make it real.`;
 if(!state.shards.includes('midnight'))return `The repaired floppy and arcade prize belong at ${link('midnight.playlist','June’s mixtape')}. Her note sequence is spread across multiple pages.`;
 if(!state.flags.postcard)return `June’s song unlocked an old message. Return to ${link('mimi.guestbook','Mimi’s Love Notes')} and send the postcard to Echo.`;
 if(!state.shards.includes('mimi'))return `Now that the floppy is repaired, return to ${link('mimi.about','Mimi’s About page')} and complete her stickers.`;
 if(!state.shards.includes('bbs'))return `Find the 4 relay stamps on Mimi, June, Sir Byte and Echo’s sites, then restore ${link('bbs.terminal','Echo’s terminal')}.`;
 if(!state.flags.ringPatched)return `Echo says the site directory lost its original 88×31 button. Return to ${link('hub.links','Startrail’s Cool Links')} to reconnect everyone.`;
 return `The lost ring is reconnected. Walk through ${link('garden.gate','Moth’s observatory gate')}.`;
}
function takeClue(word){if(!relayWords.includes(word))return;if(state.clues.includes(word)){toast('Already copied: '+word);return;}state.clues.push(word);save();beep(860,.11,'triangle');toast('✎ NEW RELAY STAMP: '+word+' ('+state.clues.length+'/4)');render();}
function enterDiskStep(bit){if(!state.flags.diskTaken){toast('No floppy inserted! Visit Mimi’s About page.');return;}if(state.flags.diskDecoded){toast('Backup already repaired. Return to Mimi!');return;}
 const expected=['SCAN','FLIP','SAVE'];diskInput.push(bit);beep(340+diskInput.length*135,.1,'square');
 if(diskInput[diskInput.length-1]!==expected[diskInput.length-1]){diskInput=[];const el=document.querySelector('#diskStatus');if(el)el.textContent='ERROR 0x11: wrong repair order. Read the label on Mimi’s floppy.';toast('DISK JAM! The sticker label has the repair order.');return;}
 const el=document.querySelector('#diskStatus');if(el)el.textContent='[ '+diskInput.join(' → ')+' ]';
 if(diskInput.length===3){state.flags.diskDecoded=true;diskInput=[];save();beep(950,.18,'triangle');toast('★ FLOPPY RESTORED! Go back to Mimi’s About page.');render();}
}
function sendPostcard(){if(!state.shards.includes('midnight')){toast('The postcard is still stuck to June’s silent mixtape.');return;}if(state.flags.postcard){toast('Echo already received the postcard!');return;}state.flags.postcard=true;save();beep(975,.16,'triangle');toast('✉ POSTCARD DELIVERED TO ECHO! The old thread is alive.');render();}
function patchRing(){if(state.shards.length<4||!state.flags.postcard){toast('The directory still has missing memory pixels!');return;}state.flags.ringPatched=true;save();melody();toast('★ THE ORIGINAL 88×31 WEBRING BUTTON IS ONLINE ★');render();}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function picture(name,width=52,cls='',alt=name){return `<img class="sticker ${cls}" src="${ART[name]}" width="${width}" height="${width}" alt="${esc(alt)}" draggable="false">`;}
function link(dest,label,cls=''){return `<a class="${cls}" href="#${dest}" data-go="${dest}">${label}</a>`;}
function action(label,act,cls='retroButton'){return `<button type="button" class="${cls}" data-action="${act}">${label}</button>`;}
function talk(who){return `<button class="charButton" data-dialog="${who}" aria-label="Talk to ${who}">${picture(who==='byte'?'knight':who==='moth'?'moth':who,who==='moth'?96:145,'float')}<span class="nameTag">CLICK TO TALK! ★</span></button>`;}
function blinkies(extra=''){return `<div class="badgeStrip"><span class="blinkie">★ BEST VIEWED AT 800x600</span><span class="blinkie">✧ NO BORING TEMPLATES ✧</span><span class="blinkie">♡ I LOVE THE INTERNET ♡</span><span class="blinkie">☻ MADE WITH LOVE AND HTML</span>${extra}</div>`;}
function pips(){return `<div class="progressPips">${Object.entries(shards).map(([k,v])=>`<span class="pip ${state.shards.includes(k)?'have':''}">${state.shards.includes(k)?'✔':'□'} ${v[0]} ${k.toUpperCase()}</span>`).join('')}</div>`;}
function status(){return `${state.shards.length}/4 pixels • ${state.clues.length}/4 relay stamps • ${state.relics.length}/5 relics`;}
function relic(key,title){return state.relics.includes(key)?`<span class="stamp">✓ ${esc(title)}</span>`:`<button class="stickerButton" title="Hmm... clickable?" data-relic="${key}">${picture(key==='404'?'ghost':key==='cursor'?'cursor':key==='cat'?'cat':key==='crown'?'crown':'planet',33,'wobble')}</button>`;}
function guests(){const def=[{name:'mimi_xoxo',msg:'my layout broke on Internet Explorer AGAIN ><',when:'09/14/2010'},{name:'junebug.mp3',msg:'leave the lights on for the people who are still finding us',when:'02/03/2011'},{name:'sir_byte',msg:'First!!! (unless I am not first)',when:'06/22/2011'},{name:'unknown_moth',msg:'Somewhere in here, there is a way home.',when:'11/11/2011'}];return [...state.book.slice().reverse(),...def].map(p=>`<div class="guestPost"><strong>★ ${esc(p.name)}</strong> <span class="tiny dim">— ${esc(p.when||'today')}</span><div>${esc(p.msg)}</div></div>`).join('');}
function guestForm(){return `<form id="guestForm" style="border:3px dashed #b78cc0;padding:10px;background:#fff8da;color:#49334d"><strong>★ SIGN THE GUESTBOOK ★</strong><div style="display:grid;grid-template-columns:1fr 2fr;gap:6px;margin:7px 0"><input name="name" class="formInput" maxlength="24" placeholder="your internet name" required><input name="msg" class="formInput" maxlength="180" placeholder="say hi or leave a secret ♡" required></div><button class="retroButton" type="submit">POST MY MESSAGE!!</button><div class="tiny">(Saved only in this browser. No real internet needed.)</div></form>`;}

 if(sub==='hall')return castleFrame(`<h2>✪ HALL OF HEROES ✪</h2><p>WELCOME to our medieval messageboard! All heroic adventurers must adopt a silly dragon. This is castle law.</p><div style="text-align:center;background:#554251;padding:15px;border:3px ridge #92796b">${picture('dragon',143,'float')}<p>YOUR DRAGON'S NAME:<br><strong style="font-size:19px;color:#fee79e">${esc(state.petName)}</strong></p><form id="petForm" style="display:flex;gap:5px;max-width:360px;margin:auto"><input name="pet" maxlength="20" required placeholder="name your dragon" class="formInput"><button class="retroButton">ADOPT!</button></form></div><p style="font-size:11px">Sir Byte says his favorite dragon names are "The Tax Collector" and "JPEG Destroyer".</p><p>RECENT HEROES: junebug.mp3 (level 42) · mimi_xoxo (level 12) · moth (level ???)</p>${relic('crown','DRAGON CROWN')}`);

function bbsPage(sub){

  if(sub==='forum')return bbsFrame(`<h1 class="bbsHeading">/board/four-missing-posts</h1><p>Somebody cross-posted pieces of Moth's relay password across the entire Webring. Echo found the directions, but the words themselves are stuck on other pages.</p><div class="bbsMessage"><strong>thread #001 • mimi_xoxo</strong>moth left a tiny handwritten word under the posts on my ${link('mimi.guestbook','Love Notes page')}! i thought it was glitter.</div><div class="bbsMessage"><strong>thread #002 • junebug.mp3</strong>my ${link('midnight.messages','unsent messages')} still have the second word. i never clicked send.</div><div class="bbsMessage"><strong>thread #003 • sir_byte</strong>a knight's sworn promise was written in ${link('castle.library','the Castle Library')}. third word!</div><div class="bbsMessage"><strong>thread #004 • echo.sys</strong>the fourth word stayed right here, on the old forum: <strong>OURS</strong>. It means the pages belonged to the people who made them.</div>${clueButton('OURS','Echo’s forum backup')}<div class="questTrail"><strong>Relay stamps copied:</strong> ${state.clues.length}/4. ${state.clues.length===4?'All words are copied! Now check the postcard and the terminal.':'Follow each cross-site link and click COPY on the stamped message.'}<p>${link('bbs.terminal','OPEN RELAY TERMINAL.EXE','retroButton')}</p></div>`);
  if(sub==='archive')return bbsFrame(`<h1 class="bbsHeading">ARCHIVE.LOG — RECOVERED 2011</h1><div class="terminal" style="min-height:0"><p>[2011-11-08] PERFECTPAGE 2.0 crawled the Webring<br>[2011-11-09] flagged 47 sites as 'obsolete aesthetic'<br>[2011-11-10] deleted visitor counters and MIDI loops<br>[2011-11-11] scheduled homepage replacement</p><p class="errorText">[WARNING] deletion cascade will remove all cross-links<br>[ERROR] orphaned index: /moth/observatory.html</p><p>[23:59:58] backup request from admin:moth<br>[23:59:59] packet split into four hand-made sites<br>[23:59:59] <span class="blink">PLEASE RESTORE THE RELAY</span></p></div><div class="bbsMessage"><strong>private log from Moth</strong>"I built the archive decoder for Mimi's corrupted floppy. Her paper label has the order. The backup contains instructions to repair June’s cassette, but it won't play without a spool from Sir Byte's arcade."</div><div class="decoder"><strong>✉ BACKUP_DISK_RESCUE.EXE</strong><p>INSERT DISK: ${state.flags.diskTaken?'[ MIMI_BACKUP.FLP DETECTED ]':'[ EMPTY SLOT ]'}</p>${state.flags.diskDecoded?`<div class="decoderStatus">✓ RESTORED — all sectors readable!</div><p>BACKUP NOTE: The <strong>third</strong> track of June’s four-note tape is <strong>MOON ☾</strong>. Bring Mimi’s floppy back to her About page. The song still needs a new spool from ${link('castle.arcade','Dragonbyte Castle')}.</p><p>${link('mimi.about','↶ DELIVER FIXED FLOPPY TO MIMI','retroButton')}</p>`:state.flags.diskTaken?`<p>Follow the three-word repair order stamped on Mimi’s disk. The buttons work like a tiny decoder minigame:</p><div id="diskStatus" class="decoderStatus">${diskInput.length?diskInput.join(' → '):'[ READY TO DECODE ]'}</div><div><button class="crumbBtn" data-disk="SAVE">SAVE</button><button class="crumbBtn" data-disk="FLIP">FLIP</button><button class="crumbBtn" data-disk="SCAN">SCAN</button></div><p class="small">HINT: ${link('mimi.about','the label is on Mimi’s About page')}</p>`:`<p>NO FLOPPY INSERTED. Find the broken sticker on ${link('mimi.about','Mimi’s About page')} and click it to take the disk.</p>`}</div><p>${relic('404','LOST GHOST')} ← ghost in the machine?</p>`);
  if(sub==='terminal')return bbsFrame(`<h1 class="bbsHeading">RUN → RELAY_REPAIR.EXE</h1><div class="terminal"><div>&gt; STARTRAIL CONNECTION UTILITY 1.2<br>&gt; FOUR RELAY STAMPS: ${state.clues.length}/4<br>&gt; POSTCARD DELIVERED: ${state.flags.postcard?'YES':'NO'}<br>&gt; ORDER OF THE RELAY: Mimi → June → Sir Byte → Echo</div><div class="terminalAnswer" id="terminalAnswer">${terminalInput.join(' ')||'_ _ _ _'}</div><div class="wordChips">${['OURS','THE','IS','WEB'].map(w=>`<button data-word="${w}">${w}</button>`).join('')}</div><p id="terminalStatus" class="small">${state.shards.includes('bbs')?'ACCESS GRANTED: THE CONNECTION PIXEL IS RESTORED':hasAllRelayWords()?'ALL RELAY STAMPS FOUND. TYPE THE WORDS IN OWNER ORDER.':'FIND STAMPS ON THE FOUR WEBSITES. A PHYSICAL POSTCARD MUST ALSO ARRIVE.'}</p>${action('[ CLEAR ]','terminalReset','honestBtn')} ${link('bbs.forum','[ where are the words? ]','honestBtn')}</div>${state.shards.includes('bbs')?questTrail(`<strong>★ ECHO’S REPLY:</strong> The relay is connected but the ring icon is missing. Go BACK to ${link('hub.links','Startrail’s old 88×31 button collection')} and fix the final link.`):questTrail(`<strong>Repair checklist:</strong> ${state.flags.postcard?'✓ June’s postcard delivered.':`□ Finish ${link('midnight.playlist','June’s song')}, then go BACK to ${link('mimi.guestbook','Mimi’s guestbook')} and forward the postcard.`} ${state.clues.length}/4 stamps copied. ${link('bbs.forum','Follow the lost post trail')}`)}</div>`);

function gardenPage(sub){
 if(sub==='home')return gardenFrame(`<div class="center">${picture('fairy',175,'float')} ${picture('moth',100,'wobble')}</div><h2>Welcome to the space between pages.</h2><p>You've followed a broken link and arrived somewhere that shouldn't exist. The grass here is made of old visitor counters; the stars are made of people who signed guestbooks and never came back.</p><p>Someone has scratched a note into the old stone:</p><div class="finalMessage">"Bring the glitter. Bring the music. Bring the games. Bring the voices. Only then can the forgotten pages remember where they belong."</div><div class="center">${talk('moth')}</div><p class="center">${link('garden.gate','✧ WALK TO THE OBSERVATORY','retroButton')}</p>`);
 if(sub==='gate')return gardenFrame(`<h2>✧ The Observatory Gate ✧</h2><div class="center">${picture('crystal',127,'pulse')} ${picture('star',115,'twirl')}</div><p>The little iron gate has four empty slots. Each one fits a different kind of memory. A handmade homepage doesn't need to be perfect; it needs a reason to exist.</p>${pips()}<div class="center" style="margin:20px 0">${state.shards.length===4&&state.flags.ringPatched?`<p class="blink" style="color:#247249;font:bold 19px Comic Sans MS">ALL FOUR MEMORIES + ORIGINAL LINKS RESTORED!!</p>${link('garden.archive','✧ OPEN THE LAST PAGE ✧','retroButton')}`:state.shards.length===4?`<p class="questHint">All four memories are here, but the gate still can't find the original Webring path. Go BACK to the ${link('hub.links','very first website’s button collection')} and reconnect the ring.</p>`:`<p class="questHint">${4-state.shards.length} memories are still missing. ${nextHint()}</p>${link('hub.directory','↶ FOLLOW THE LINK TRAIL','retroButton')}`}</div><p class="center small">The gate recognizes the things you actually did, not just the pages you opened.</p>`);
 if(sub==='archive'){
  if(state.shards.length!==4||!state.flags.ringPatched)return gardenPage('gate');
  return gardenFrame(`<div class="center">${picture('moth',90,'float')}${picture('star',105,'pulse')}${picture('fairy',90,'wobble')}</div><h2>YOU FOUND THE LAST PAGE.</h2><p>A tiny light clicks on. Then a thousand others. Each one is a homepage somebody made when they were bored, lonely, excited, or just wanted to show off a pixelated cat.</p><div class="finalMessage"><strong>THE FINAL MESSAGE FROM MOTH:</strong><p>I wasn't a real webmaster. I was a little script built to connect all your pages. Every time somebody clicked a link, left a comment, or visited a website nobody else had seen, I learned another piece of what being together meant.</p><p>PERFECTPAGE didn’t erase me. It erased the connections that made me possible. A disk from Mimi repaired by Echo, a tape from June repaired with Sir Byte’s arcade part, and a note that traveled back to where it began — those were the connections it could never understand.</p><p>But you went looking. You remembered four strangers by spending time in the things they made. And now I know how to turn the lights back on.</p><p>There's just one decision left.</p></div><h2>What should we do with the Webring?</h2><div class="miniGrid" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px"><div style="border:3px dashed #90b3bd;padding:12px;background:#f4ffff"><h3>★ Send the signal</h3><p>Restore every broken link and invite everybody to build their own weird corner again.</p>${link('end.signal','LET THE WHOLE WEB SEE!','retroButton')}</div><div style="border:3px dashed #cba8c0;padding:12px;background:#fff4fb"><h3>♡ Protect the shelter</h3><p>Save a private little copy so the old sites can always be visited, even if the rest of the web changes.</p>${link('end.shelter','KEEP OUR LITTLE HOME SAFE','retroButton')}</div></div>`);
 }
}
function ending(type){const signal=type==='signal';return gardenFrame(`<div class="center">${picture('rainbow',85,'wobble')}${picture('star',125,'twirl')}${picture('butterfly',84,'float')}</div><div class="endingType">${signal?'★ THE SIGNAL ENDING ★':'♡ THE SHELTER ENDING ♡'}</div><div class="center" style="font:22px Comic Sans MS,cursive;color:#9f4c9f">YOU SAVED THE WEBRING!!!</div><div class="finalMessage">${signal?`The star brightens above every little homepage. Buttons blink again. Guestbooks fill up. A kid on the other side of the world finds Mimi's page, then June's song, then a castle game — and decides to make a website too.`:`The star shines over a secret garden. Moth keeps a copy of every lovingly crooked layout, every terrible poem, every pixel cat. The pages no longer have to be popular, useful, or fashionable. They just have to be here.`}</div><p>Moth's final note appears on an old computer screen:</p><blockquote style="font:italic 20px Georgia,serif;color:#75538b">"The best part of the internet was never the websites. It was that someone, somewhere, made them — and someone else cared enough to visit."</blockquote><p class="center">Mimi, June, Sir Byte, and Echo are still out there. Their sites aren't perfect. That's why you can tell they're real.</p><div class="center" style="margin:20px 0">${picture('mimi',90,'wobble')} ${picture('june',90,'float')} ${picture('knight',90,'wobble')} ${picture('echo',90,'float')}</div><div class="center"><span class="visitCounter">001338</span><p>VISITOR COUNT +1. That's you.</p>${link('hub.home','↶ RETURN TO THE WEBRING','retroButton')} ${action('↻ START A NEW STORY','restart','retroButton')}</div><p class="center small">ENDINGS FOUND: ${state.endings.length}/2 · SECRET RELICS: ${state.relics.length}/5 · THANK YOU FOR PLAYING ♡</p>`);}

function notebook(){return `<div style="padding:2px"><h2 style="margin:3px 0;font:25px Comic Sans MS;color:#92276d">★ MY TANGLED WEBRING NOTEBOOK ★</h2><p>You are visiting STARTRAIL on <strong>November 11, 2011, 11:59 PM</strong>. Pages are being erased, and the last owners hid ways to help each other.</p><div class="questTrail"><strong>★ NEXT BEST LEAD:</strong> ${nextHint()}</div>${pips()}<div style="border:3px dashed #a86596;padding:12px;margin:12px 0;background:#fffbe3;color:#452e48"><strong>THE REPAIR CHAIN:</strong><div style="font:13px/1.9 'Comic Sans MS',cursive">${state.flags.diskTaken?'✓':'□'} Find Mimi’s corrupted backup floppy<br>${state.flags.diskDecoded?'✓':'□'} Bring it to Echo’s archive, decode it, and return to Mimi<br>${state.shards.includes('castle')?'✓':'□'} Win the star game to get Sir Byte’s tape spool<br>${state.shards.includes('midnight')?'✓':'□'} Combine the clues to repair June’s mixtape<br>${state.flags.postcard?'✓':'□'} Return to Mimi and forward June’s postcard to Echo<br>${state.shards.includes('mimi')?'✓':'□'} Recover all three stickers, including the repaired floppy<br>${state.shards.includes('bbs')?'✓':'□'} Collect relay stamps and restore Echo’s terminal<br>${state.flags.ringPatched?'✓':'□'} Return to the first website and repair its missing link button</div></div><strong>✎ RELAY STAMPS — ${state.clues.length}/4</strong><p>Collect one from each website: ${relayWords.map((w,i)=>`<span class="stamp" style="display:inline-block;margin:2px">${state.clues.includes(w)?'★ '+w:'□ ????? ('+['Mimi','June','Byte','Echo'][i]+')'}</span>`).join('')}</p><p class="small">You don’t need to memorize everything. Click the written stamps to copy them into this notebook.</p><strong>SECRET RELICS — ${state.relics.length}/5</strong><p class="small">${state.relics.length?state.relics.map(x=>'★ '+esc(x)).join(' · '):'Explore unusual subpages and click suspicious pictures!'}</p><p><strong>Ending postcards:</strong> ${state.endings.length}/2</p><div class="pageLinks">${link('hub.directory','★ directory','retroButton')}${link('bbs.forum','✎ message trail','retroButton')}${link('garden.gate','✧ final gate','retroButton')}</div></div>`;}

const starsBg=Array.from({length:48},(_,i)=>({x:(i*89+31)%640,y:(i*47+19)%280,c:['#384b7a','#5667ab','#a09ac8','#f5d69e'][i%4]}));

function setupArcade(){const canvas=document.querySelector('#arcadeCanvas');if(!canvas)return;arcade={canvas,ctx:canvas.getContext('2d'),active:false,x:305,score:0,lives:3,items:[],spawn:0,last:0,elapsed:0,held:0};drawArcade(arcade);canvas.addEventListener('pointerdown',e=>{movePointer(e);try{canvas.setPointerCapture(e.pointerId)}catch(_){}});canvas.addEventListener('pointermove',e=>{if(arcade?.active)movePointer(e);});}
function movePointer(e){if(!arcade||!arcade.active)return;const r=arcade.canvas.getBoundingClientRect();arcade.x=Math.max(24,Math.min(616,(e.clientX-r.left)/r.width*640));}
function startArcade(){if(route!=='castle.arcade'||!arcade)return;const a=arcade;a.active=true;a.score=0;a.lives=3;a.items=[];a.spawn=.2;a.elapsed=0;a.last=performance.now();a.x=320;a.held=0;document.querySelector('#arcadeStart').textContent='RESTART ↻';requestAnimationFrame(tickArcade);beep(450,.2);}
function tickArcade(t){const a=arcade;if(!a||!a.active||route!=='castle.arcade')return;let dt=Math.min((t-a.last)/1000,.08);a.last=t;a.elapsed+=dt;
 if(a.held!==0)a.x=Math.max(25,Math.min(615,a.x+a.held*360*dt));
 a.spawn-=dt;if(a.spawn<=0){a.spawn=.43+Math.random()*.28;a.items.push({x:30+Math.random()*580,y:-20,kind:Math.random()<.24?'bad':'star',speed:92+a.elapsed*2.4+Math.random()*38,wobble:Math.random()*6.28});}
 for(let j=a.items.length-1;j>=0;j--){let o=a.items[j];o.y+=o.speed*dt;o.x+=Math.sin(a.elapsed*5+o.wobble)*.3;if(o.y>226&&o.y<277&&Math.abs(o.x-a.x)<34){a.items.splice(j,1);if(o.kind==='star'){a.score++;beep(700+45*a.score,.09,'triangle',.1);if(a.score>=8){arcadeEnd(a,true);return;}}else{a.lives--;beep(160,.25,'sawtooth',.1);if(a.lives<=0){arcadeEnd(a,false);return;}}}else if(o.y>298)a.items.splice(j,1);}
 drawArcade(a);document.querySelector('#arcadeScore').textContent='★ '+a.score+' / 8';document.querySelector('#arcadeLives').textContent='♥ '.repeat(a.lives);document.querySelector('#arcadeMsg').textContent='CATCH THE STARS!';requestAnimationFrame(tickArcade);
}
function drawArcade(a){const c=a.ctx;c.imageSmoothingEnabled=false;c.fillStyle='#0d1736';c.fillRect(0,0,640,280);
 // starry night, distant castle, bright pixel ground
 for(const s of starsBg){c.fillStyle=s.c;c.fillRect(s.x,s.y,3,3);}
 c.fillStyle='#1c2d4a';for(let x=0;x<640;x+=92){c.fillRect(x,118+((x*7)%41),55,175);c.fillRect(x+12,90+((x*11)%31),31,90);}
 c.fillStyle='#34426a';c.fillRect(0,253,640,27);for(let x=0;x<640;x+=27){c.fillStyle=x%2?'#61709d':'#8291b1';c.fillRect(x,254,26,5);}c.fillStyle='#72bd95';c.fillRect(0,272,640,8);
 for(const o of a.items){let im=pixelSprites[o.kind==='star'?'star':'ghost'];if(im?.complete&&im.naturalWidth)c.drawImage(im,o.x-16,o.y-16,33,33);else{c.fillStyle=o.kind==='star'?'#fce167':'#dd64a6';c.fillRect(o.x-12,o.y-12,24,24);}}
 if(pixelSprites.knight.complete&&pixelSprites.knight.naturalWidth)c.drawImage(pixelSprites.knight,a.x-29,204,58,59);else{c.fillStyle='#a4bbeb';c.fillRect(a.x-20,208,40,48);}
 c.fillStyle='#e4c07a';c.fillRect(a.x-30,254,60,6);
 if(!a.active){c.fillStyle='rgba(5,5,20,.8)';c.fillRect(79,60,482,143);c.fillStyle='#fff1a4';c.font='bold 27px monospace';c.textAlign='center';c.fillText(a.message||'★ STAR CATCHER ★',320,114);c.font='bold 16px monospace';c.fillStyle='#b7eac7';c.fillText(a.submessage||'CLICK START GAME TO PLAY!',320,149);c.textAlign='start';}
}

 if(act==='back')history.back();if(act==='forward')history.forward();

 if(act==='terminalReset'){terminalInput=[];render();}
 if(act==='arcadeStart')startArcade();
 if(act==='left'&&arcade&&arcade.active)arcade.x=Math.max(25,arcade.x-62);
 if(act==='right'&&arcade&&arcade.active)arcade.x=Math.min(615,arcade.x+62);
 if(act==='stickerGiggle'){beep(660,.08);toast(['✿ THIS IS A REALLY CUTE STICKER ✿','TAKE IT TO YOUR IMAGINARY WEBSITE!','YOU FOUND A WHOLE LOT OF GLITTER.','DO NOT FEED AFTER MIDNIGHT.'][Math.floor(Math.random()*4)]);}
 if(act==='button'){beep(750,.06);toast('★ STICK THIS BUTTON ON YOUR IMAGINARY HOME PAGE!! ★');}
 if(act==='restart')resetGame();
 if(act==='max'){document.querySelector('.webpage')?.classList.toggle('wideScreen');toast('FULL SCREEN INTERNET MODE ACTIVATED!!');}
 if(act==='min')toast('YOU CAN\'T MINIMIZE THE INTERNET! (you can close this tab though.)');
 if(act==='x')toast('CLOSE BUTTON DECLINED. THE POPUPS ARE SENTIENT.');
});
document.addEventListener('submit',e=>{
 if(e.target.id==='addressForm'){addressSubmit(e);return;}
 if(e.target.id==='guestForm'){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')||'').trim().slice(0,24),msg=String(f.get('msg')||'').trim().slice(0,180);if(!name||!msg)return;state.book.push({name,msg,when:'today'});state.book=state.book.slice(-20);save();beep(870,.13);toast('★ YOUR GUESTBOOK MESSAGE IS SAVED! ★');render();return;}
 if(e.target.id==='petForm'){e.preventDefault();let name=String(new FormData(e.target).get('pet')||'').trim().slice(0,20);if(!name)return;state.petName=name;save();toast('🐉 YOUR DRAGON IS NOW '+name.toUpperCase()+'!');render();}
});
let heldDirection=0;
document.addEventListener('pointerdown',e=>{makeSparkles(e);const n=e.target.closest('#moveLeft,#moveRight');if(n&&arcade?.active){arcade.held=n.id==='moveLeft'?-1:1;}});
for(const ev of ['pointerup','pointercancel'])document.addEventListener(ev,()=>{if(arcade)arcade.held=0;});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeDialog();return;}
 if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key)&&arcade?.active&&!dialog&&route==='castle.arcade'){if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')arcade.held=-1;else arcade.held=1;e.preventDefault();}
});
document.addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key)&&arcade)arcade.held=0;});
document.querySelector('#dialogLayer').addEventListener('click',e=>{if(e.target.id==='dialogLayer')closeDialog();});

window.addEventListener('hashchange',()=>{tapeInput=[];terminalInput=[];diskInput=[];closeDialog();render({resetScroll:true});});
window.addEventListener('blur',()=>{if(arcade)arcade.held=0;});
if(!location.hash){try{history.replaceState(null,'',location.pathname+location.search+'#hub.home');}catch(e){/* Embedded previews may not allow history edits. */}}
render();
</script>
</body>
</html>
