<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111319">
  <title>Wordle Unlimited</title>
  <link rel="icon" type="image/x-icon" href="../../../../assets/word-games-favicon.ico">
  <style>
    :root { --bg:#160d20; --panel:#251731; --panel-light:#32203f; --ink:#fff8ff; --muted:#c7b6cf; --line:#69537b; --purple:#d69cff; --pink:#ff8cd6; --correct:#a8e776; --present:#ffd66e; --absent:#29232e; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; color:var(--ink); font:16px/1.4 Inter,ui-sans-serif,system-ui,sans-serif; background:radial-gradient(circle at 50% -15%,#5d3379 0,transparent 36rem),radial-gradient(circle at 0 92%,#55294f 0,transparent 28rem),var(--bg); }
    main { width:min(620px,calc(100% - 28px)); min-height:100vh; margin:auto; display:flex; flex-direction:column; padding:34px 0 28px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:14px; }
    .eyebrow { margin:0 0 5px; color:var(--purple); font:800 .68rem ui-monospace,monospace; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(2.2rem,8vw,4.25rem); line-height:.86; letter-spacing:-.08em; }
    .new-word { cursor:pointer; color:#291033; white-space:nowrap; font:800 .69rem ui-monospace,monospace; letter-spacing:.06em; border:0; border-radius:10px; background:var(--purple); padding:11px 12px; box-shadow:0 8px 24px rgba(214,156,255,.26); }
    .new-word:hover { background:#e8bdff; transform:translateY(-1px); }
    .new-word:focus-visible,.key:focus-visible { outline:3px solid var(--pink); outline-offset:3px; }
    .status { min-height:23px; margin:15px 0 12px; color:var(--muted); text-align:center; font-size:.82rem; }
    .status.error { color:var(--pink); }
    .board { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; width:min(100%,360px); margin:0 auto; }
    .tile { aspect-ratio:1; display:grid; place-items:center; color:var(--ink); font:900 clamp(1.45rem,8vw,2.25rem)/1 ui-monospace,monospace; text-transform:uppercase; border:2px solid var(--line); border-radius:7px; background:rgba(0,0,0,.17); transition:transform .12s,background .3s,border-color .3s; }
    .tile.filled { border-color:#a883ba; }
    .tile.correct { color:#18230d; border-color:var(--correct); background:var(--correct); }
    .tile.present { color:#3a2b06; border-color:var(--present); background:var(--present); }
    .tile.absent { color:#ddd4e2; border-color:var(--absent); background:var(--absent); }
    .tile.pop { animation:pop .18s ease-out; }
    @keyframes pop { 50% { transform:scale(1.12); } }
    .legend { display:flex; justify-content:center; gap:13px; margin:17px 0 19px; color:var(--muted); font-size:.67rem; }
    .legend span { display:flex; align-items:center; gap:5px; }
    .legend i { width:11px; height:11px; display:block; border-radius:3px; }
    .keyboard { width:min(100%,530px); margin:auto auto 0; }
    .key-row { display:flex; justify-content:center; gap:5px; margin-top:6px; }
    .key { min-width:calc((100% - 36px)/10); height:53px; cursor:pointer; color:var(--ink); font:800 clamp(.65rem,2.6vw,.86rem)/1 ui-monospace,monospace; border:0; border-radius:6px; background:#4a3a55; transition:background .2s,transform .12s; }
    .key:hover { background:#665071; transform:translateY(-1px); }
    .key.wide { min-width:calc((100% - 36px)/6.4); font-size:.65rem; }
    .key.correct { color:#18230d; background:var(--correct); }.key.present { color:#3a2b06; background:var(--present); }.key.absent { color:#ded6e2; background:var(--absent); }
    .footer { margin:17px 0 0; color:#8e7d99; text-align:center; font-size:.68rem; }
    @media (max-width:480px) { main { width:min(100% - 20px,620px); padding:18px 0 14px; } h1 { font-size:2.4rem; } .new-word { padding:10px 8px; font-size:.59rem; } .status { margin:10px 0; } .board { width:min(100%,330px); gap:5px; } .key { height:47px; border-radius:5px; } .legend { margin:12px 0; } .footer { margin-top:12px; } }
  </style>
  <link rel="stylesheet" href="./game-theme.css">
</head>
<body data-game="wordle">
  <main>
    <header><div><p class="eyebrow">Same word list · infinite rounds</p><h1>Wordle<br>Unlimited</h1></div><button class="new-word" id="newWord" type="button">NEW WORD ↻</button></header>
    <p class="status" id="status" role="status" aria-live="polite">Loading the word list…</p>
    <section class="board" id="board" aria-label="Six guesses of five letters"></section>
    <div class="legend" aria-label="Colour legend"><span><i style="background:var(--correct)"></i>right spot</span><span><i style="background:var(--present)"></i>wrong spot</span><span><i style="background:var(--absent)"></i>not used</span></div>
    <section class="keyboard" id="keyboard" aria-label="On-screen keyboard"></section>
    <p class="footer">A new random five-letter word is always one click away.</p>
  </main>
  <script src="./game-stats.js"></script>
  <script>
    GameStats.mount('wordle', 'main > header');
    const WORD_API = 'https://api.anrat.link/words?length=5';
    const FALLBACK_WORDS = ['ACTOR','ANGER','BRAIN','BROWN','CLEAN','DANCE','GONER','GRADE','GRAND','LANCE','MAKER','PANEL','PETAL','PLANE','PLANT','PLATE','PLEAT','RAKES','RANGE','SKATE','SPARE','SPEAK','STAKE','STARE','STEAK','TAKER','TAKES','TAMER','TEAMS','TEARS','TRAIN'];
    const board = document.querySelector('#board'), keyboard = document.querySelector('#keyboard'), status = document.querySelector('#status');
    const rows = 6, columns = 5, keys = ['QWERTYUIOP','ASDFGHJKL','↵ZXCVBNM⌫'];
    let words = [...FALLBACK_WORDS], answer = '', guess = '', row = 0, finished = false, keyStates = {};
    const roundClock = GameStats.createActiveTimer();
    const rank = { absent:1, present:2, correct:3 };
    const pick = list => list[Math.floor(Math.random() * list.length)];
    function renderBoard() { board.innerHTML=''; for(let rowIndex=0;rowIndex<rows;rowIndex++) for(let column=0;column<columns;column++) { const tile=document.createElement('div'); tile.className='tile'; tile.id=`tile-${rowIndex}-${column}`; tile.setAttribute('aria-label',`Row ${rowIndex+1}, letter ${column+1}`); board.append(tile); } }
    function renderKeyboard() { keyboard.innerHTML=''; keys.forEach(line=>{ const rowNode=document.createElement('div'); rowNode.className='key-row'; [...line].forEach(letter=>{ const button=document.createElement('button'); button.className='key'+(letter==='↵'||letter==='⌫'?' wide':''); button.type='button'; button.dataset.key=letter; button.textContent=letter==='↵'?'ENTER':letter==='⌫'?'DELETE':letter; button.setAttribute('aria-label',button.textContent); button.addEventListener('click',()=>handleKey(letter)); rowNode.append(button); }); keyboard.append(rowNode); }); }
    function paintCurrent() { for(let column=0;column<columns;column++) { const tile=document.querySelector(`#tile-${row}-${column}`); if(!tile) return; tile.textContent=guess[column]||''; tile.classList.toggle('filled',Boolean(guess[column])); } }
    function scoreGuess(value) { const marks=Array(columns).fill('absent'); const counts={}; [...answer].forEach(letter=>counts[letter]=(counts[letter]||0)+1); [...value].forEach((letter,index)=>{ if(letter===answer[index]) { marks[index]='correct'; counts[letter]--; } }); [...value].forEach((letter,index)=>{ if(marks[index]!=='correct' && counts[letter]>0) { marks[index]='present'; counts[letter]--; } }); return marks; }
    function updateKey(letter, state) { if(rank[state] > (rank[keyStates[letter]]||0)) keyStates[letter]=state; document.querySelector(`[data-key="${letter}"]`)?.classList.remove('correct','present','absent'); document.querySelector(`[data-key="${letter}"]`)?.classList.add(keyStates[letter]); }
    function submitGuess() { if(guess.length!==columns) { status.textContent='Five letters, please.'; status.classList.add('error'); return; } if(!words.includes(guess)) { status.textContent='That word is not in this list.'; status.classList.add('error'); return; } const marks=scoreGuess(guess); marks.forEach((mark,column)=>{ const tile=document.querySelector(`#tile-${row}-${column}`); tile.classList.add(mark); updateKey(guess[column],mark); }); const won=guess===answer; row++; guess=''; if(won) { finished=true; roundClock.stop(); GameStats.record('wordle',true,roundClock.elapsed()/1000); status.textContent='Perfect — '+answer+' was the word!'; status.classList.remove('error'); return; } if(row===rows) { finished=true; roundClock.stop(); GameStats.record('wordle',false,roundClock.elapsed()/1000); status.textContent='The word was '+answer+'. New word?'; status.classList.add('error'); return; } status.textContent=(rows-row)+' guesses left.'; status.classList.remove('error'); }
    function handleKey(key) { if(finished) return; if(key==='⌫') { guess=guess.slice(0,-1); paintCurrent(); return; } if(key==='↵') { submitGuess(); return; } if(/^[A-Z]$/.test(key) && guess.length<columns) { guess+=key; paintCurrent(); document.querySelector(`#tile-${row}-${guess.length-1}`)?.classList.add('pop'); } }
    function newGame() { if(answer&&!finished&&(row>0||guess.length)) GameStats.record('wordle',false,roundClock.elapsed()/1000); answer=pick(words); roundClock.reset(); guess=''; row=0; finished=false; keyStates={}; renderBoard(); renderKeyboard(); status.textContent='Six guesses. Good luck.'; status.classList.remove('error'); }
    async function loadWords() { try { const response=await fetch(WORD_API,{headers:{accept:'application/json'}}); if(!response.ok) throw new Error('Word API unavailable.'); const data=await response.json(); const remote=Array.isArray(data.lengths?.[5]) ? data.lengths[5].map(word=>word.toUpperCase()).filter(word=>/^[A-Z]{5}$/.test(word)) : []; if(remote.length>=10) words=[...new Set(remote)]; status.textContent='Word list synced. Six guesses.'; } catch { status.textContent='Offline word list loaded. Six guesses.'; } if(!answer||(!row&&!guess.length)) newGame(); }
    document.addEventListener('keydown',event=>{ if(event.ctrlKey||event.metaKey||event.altKey) return; if(event.key==='Enter') handleKey('↵'); else if(event.key==='Backspace') handleKey('⌫'); else if(/^[a-z]$/i.test(event.key)) handleKey(event.key.toUpperCase()); });
    document.querySelector('#newWord').addEventListener('click',newGame);
    loadWords();
  </script>
</body>
</html>
