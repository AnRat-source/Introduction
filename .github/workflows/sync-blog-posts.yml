name: Sync Blog posts

on:
  discussion:
    types: [created, edited, deleted, category_changed]
  push:
    branches: [main]
    paths:
      - 'blog.html'
      - 'blog.js'
      - 'blog-posts.json'
      - 'scripts/sync-blog-posts.mjs'
      - '.github/workflows/sync-blog-posts.yml'
  workflow_dispatch:

permissions:
  contents: write
  discussions: read
  pages: write

jobs:
  sync-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-blog-posts.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: commit
        run: |
          if git diff --quiet -- blog-posts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-posts.json
          git commit -m "chore: sync blog posts"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.commit.outputs.changed == 'true'
        run: |
          curl --fail --retry 3 --retry-delay 5 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"
        env:
          GITHUB_TOKEN: ${{ github.token }}
